[workspace]
resolver = "2"
members = [
  "crates/api",
  "crates/application",
  "crates/capability-workshop",
  "crates/domain",
  "crates/infra-postgres",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
uuid = { version = "1.24.0", features = ["v7"] }
chrono = { version = "0.4.45", default-features = false, features = [
  "std",
  "clock",
] }

axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.4"

sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "macros",
  "migrate",
  "chrono",
  "uuid",
] }

get_if_addrs = "0.5.3"
thiserror = "2.0.19"
